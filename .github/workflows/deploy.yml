name: Laravel Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP Laravel
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Create Database
        run: |
          mkdir -p database
          touch database/database.mysql

      - name: Execute tests
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: database/database.mysql
        run: php artisan test

      # 1. Docker Hub Login
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2. Build & Push Image to Docker Hub
      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/projects-app:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/projects-app:latest

      # 3. SSH into EC2 & Deploy Container
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/projects-app:latest
            docker stop projects-app || true
            docker rm projects-app || true
            docker run -d -p 80:80 --name projects-app ${{ secrets.DOCKERHUB_USERNAME }}/projects-app:latest
